# Replace replace-me.example.com with public Mastra host before importing this manifest.
display_information:
  name: mastra-agent
  description: Mastra agent with streaming responses and human-approved tool calls
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: mastra-agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:read
      - reactions:write
      - users:read
  pkce_enabled: false
settings:
  event_subscriptions:
    request_url: https://replace-me.example.com/api/agents/agent/channels/slack/webhook
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
    request_url: https://replace-me.example.com/api/agents/agent/channels/slack/webhook
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: false
